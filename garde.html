<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;600;700&family=Manrope:wght@300;400;600&display=swap" rel="stylesheet">
    <title>PAGE DE GARDE</title>
    <style>
        :root {
            --bg-dark: #0f172a;
            --accent: #16a34a;
            --accent-dark: #0f8a3a;
            --text: #f8fafc;
            --muted: rgba(248, 250, 252, 0.75);
        }

        body {
            min-height: 100vh;
            margin: 0;
            font-family: 'Manrope', sans-serif;
            background: var(--bg-dark);
            color: var(--text);
        }

        .hero {
            position: relative;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 48px 20px;
            overflow: hidden;
        }

        .hero::before {
            content: "";
            position: absolute;
            inset: 0;
            background: url("Images/bus.png") center/cover no-repeat;
            filter: grayscale(10%) contrast(1.05);
            transform: scale(1.02);
            z-index: 0;
        }

        .hero::after {
            content: "";
            position: absolute;
            inset: 0;
            background: linear-gradient(120deg, rgba(15, 23, 42, 0.85) 15%, rgba(15, 23, 42, 0.55) 60%, rgba(15, 23, 42, 0.9) 100%);
            z-index: 1;
        }

        .hero-card {
            position: relative;
            z-index: 2;
            width: min(880px, 100%);
            padding: 48px 40px;
            text-align: center;
            border-radius: 28px;
            backdrop-filter: blur(8px);
            background: rgba(15, 23, 42, 0.35);
            border: 1px solid rgba(255, 255, 255, 0.15);
            box-shadow: 0 30px 60px rgba(15, 23, 42, 0.35);
            animation: heroGlowIn 1s ease forwards;
        }

        .hero-title {
            font-family: 'Playfair Display', serif;
            font-size: clamp(2.2rem, 4vw, 3.4rem);
            margin-bottom: 12px;
            letter-spacing: 0.5px;
            animation: heroTitleIn 1.1s ease forwards;
            animation-delay: 0.1s;
            opacity: 0;
        }

        .hero-subtitle {
            font-size: clamp(1.2rem, 2.6vw, 2rem);
            color: #2563eb;
            margin-bottom: 28px;
            font-style: italic;
            animation: heroSubtitleIn 2.1s ease forwards;
            animation-delay: 2s;
            opacity: 0;
        }

        .hero-actions {
            display: flex;
            justify-content: center;
            animation: heroCtaIn 1.1s ease forwards;
            animation-delay: 0.4s;
            opacity: 0;
        }

        .hero-btn {
            background: var(--accent);
            color: #fff;
            padding: 14px 28px;
            border-radius: 999px;
            font-weight: 600;
            font-size: 1rem;
            text-decoration: none;
            box-shadow: 0 16px 30px rgba(22, 163, 74, 0.35);
            transition: transform 0.2s ease, background 0.2s ease, box-shadow 0.2s ease;
        }

        .hero-btn:hover {
            transform: translateY(-2px);
            background: var(--accent-dark);
            color: #fff;
            text-decoration: none;
            box-shadow: 0 18px 34px rgba(22, 163, 74, 0.45);
        }

        @keyframes heroGlowIn {
            from {
                opacity: 0;
                transform: translateY(32px) scale(0.98);
                box-shadow: 0 0 0 rgba(15, 23, 42, 0);
            }
            to {
                opacity: 1;
                transform: translateY(0) scale(1);
                box-shadow: 0 30px 60px rgba(15, 23, 42, 0.35);
            }
        }

        @keyframes heroTitleIn {
            from {
                opacity: 0;
                transform: translateY(18px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes heroSubtitleIn {
            from {
                opacity: 0;
                transform: translateY(16px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes heroCtaIn {
            from {
                opacity: 0;
                transform: translateY(14px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @media (max-width: 576px) {
            .hero-card {
                padding: 36px 22px;
                border-radius: 22px;
            }

            .hero-actions {
                width: 100%;
            }

            .hero-btn {
                width: 100%;
                text-align: center;
            }
        }
    </style>
</head>
<body>
    <section class="hero">
        <div class="hero-card">
            <h1 class="hero-title">Bienvenue à GENERAL EXPRESS VOYAGE</h1>
            <p class="hero-subtitle"> "Le plaisir de voyager" </p>
            <div class="hero-actions">
                <a class="hero-btn" href="Accueil.html">Faire une reservation</a>
            </div>
        </div>
    </section>
</body>
</html>
